<!-- HCT Calibration - 화면 뼈대(index.html). 실제 화면은 app.js 가 #app 안에 그린다. 디자인은 style.css. -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- 모바일 화면 맞춤. maximum-scale=1 은 아이폰에서 입력칸을 누를 때 화면이 확대되는 것을 막는다. -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>HCT Calibration</title>
<!-- 홈 화면 설치(PWA)용 설정 파일과 아이콘. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<!-- 주소창 색과 '앱으로 열기' 설정(아이폰 홈 화면 앱). -->
<meta name="theme-color" content="#1f4e8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- 디자인 파일. -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 앱 화면이 그려지는 영역. -->
<div id="app"></div>
<!-- 숫자 칸을 누르면 키보드 위에 나타나는 버튼 바(± 부호 / 다음 ▶ / 완료). 동작은 app.js 의 [10]. -->
<div id="kb"><button data-k="sign">± 부호</button><button data-k="next">다음 ▶</button><button data-k="done">완료</button></div>
<!-- 동작 파일(맨 아래에서 불러와야 위 요소를 찾을 수 있음). -->
<script src="app.js"></script>
</body>
</html>
