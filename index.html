<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>HCT Calibration</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#1f4e8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f3f4f6;--c:#fff;--t:#1b2230;--l:#cfd5df;--p:#1f4e8c;--h:#e9edf3;--cw:78px;--fs:15px}
@media(prefers-color-scheme:dark){:root{--bg:#12151b;--c:#1b2029;--t:#e7eaf0;--l:#334050;--h:#252c38;--p:#4a85d6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:14px/1.4 system-ui,-apple-system,"Malgun Gothic",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
html{-webkit-text-size-adjust:100%}#app{max-width:1000px;margin:0 auto;padding:10px 10px 80px}
h1{font-size:18px;margin:4px 0}
.top{position:sticky;top:0;z-index:5;display:flex;gap:8px;background:var(--bg);padding:6px 0}
.top button{flex:1;padding:12px;font-size:15px}
.card{background:var(--c);border:1px solid var(--l);border-radius:8px;padding:10px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
label{font-weight:600;font-size:13px}
input,select{font:inherit;color:inherit;background:var(--c);border:1px solid var(--l);border-radius:5px;padding:6px;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--p);outline-offset:-1px}
button{font:inherit;border:0;border-radius:6px;padding:8px 12px;font-weight:600;cursor:pointer;color:#fff;background:var(--p)}
button.g{background:#2a7d4f}button.r{background:#b83a3a}
button.s{background:var(--h);color:var(--t);border:1px solid var(--l)}
.grp{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
textarea{font:inherit;color:inherit;background:var(--c);border:1px solid var(--l);border-radius:5px;padding:6px;resize:none;overflow:hidden;min-width:0}
textarea:focus{outline:2px solid var(--p);outline-offset:-1px}
.sc{overflow-x:auto}
.sc::-webkit-scrollbar{height:10px}.sc::-webkit-scrollbar-thumb{background:var(--l);border-radius:5px}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--l);padding:2px;text-align:center;white-space:nowrap}
th{background:var(--h);font-size:12px;padding:4px}
td input{width:100%;min-width:var(--cw,62px);font-size:var(--fs,14px);border:0;text-align:center;padding:6px 2px;background:transparent}
#kb{position:fixed;left:0;right:0;bottom:0;display:none;gap:8px;padding:8px;background:var(--h);border-top:1px solid var(--l);z-index:20}#kb button{flex:1;padding:12px;font-size:16px;background:var(--c);color:var(--t);border:1px solid var(--l)}
.st{position:sticky;left:0;background:var(--h);z-index:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="kb"><button data-k="sign">± 부호</button><button data-k="next">다음 ▶</button><button data-k="done">완료</button></div>
<script>
const $=s=>document.querySelector(s),K='hctcal_v2_state',rng=n=>Array.from({length:n},(_,i)=>i);
const T={
base:{name:'기본',t:[{n:'기본',m:['측정항목','측정조건','측정범위','최소눈금','단위'],d:{},reps:3,rc:5,add:1}]},
temp:{name:'온/습도',t:[{n:'온도',m:['측정항목','단위','Memo'],d:{측정항목:'온도',단위:'℃'},ch:1,reps:3,rc:3,add:1},{n:'습도',m:['측정항목','단위','Memo'],d:{측정항목:'습도',단위:'% R.H.'},ch:1,reps:3,rc:3,add:1}]},
scale:{name:'전기식 지시저울',t:[{n:'기기정보',m:[],fix:['최대용량','최소눈금','단위'],rl:['값']},{n:'스팬조정',m:[],fix:['빈접시','최대용량'],rl:['조정 전','조정 후']},{n:'편심오차',m:['시험추'],fix:['위치1','위치2','위치3','위치4','위치5'],rl:['지시값']},{n:'직선성',m:[],reps:3,rc:6},{n:'최소유효무게',m:['명목값'],fix:rng(10).map(i=>(i+1)+'회'),rl:['측정값']}]},
press:{name:'압력계',t:[{n:'압력계',m:['최대용량','최소눈금','단위'],d:{단위:'MPa'},reps:3,rc:12,add:1}]},
timer:{name:'타이머/RPM',t:[{n:'타이머/RPM',m:['장비분해능','측정분해능','단위'],d:{단위:'s'},reps:5,rc:3,add:1}]}};
const J={ㄱ:'R',ㄲ:'R',ㄴ:'S',ㄷ:'E',ㄸ:'E',ㄹ:'F',ㅁ:'A',ㅂ:'Q',ㅃ:'Q',ㅅ:'T',ㅆ:'T',ㅇ:'D',ㅈ:'W',ㅉ:'W',ㅊ:'C',ㅋ:'Z',ㅌ:'X',ㅍ:'V',ㅎ:'G',ㅏ:'K',ㅐ:'O',ㅑ:'I',ㅒ:'O',ㅓ:'J',ㅔ:'P',ㅕ:'U',ㅖ:'P',ㅗ:'H',ㅛ:'Y',ㅜ:'N',ㅠ:'B',ㅡ:'M',ㅣ:'L'};
const mk=(si,sp)=>({si,m:Object.fromEntries(sp.m.map(k=>[k,(sp.d||{})[k]||''])),reps:sp.rl?sp.rl.slice():rng(sp.reps).map(i=>(i+1)+'회'),rows:sp.fix?sp.fix.map(l=>({nom:l,v:{}})):rng(sp.rc).map(()=>({nom:'',ch:'',v:{}}))});
const today=()=>{const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')};
const U=()=>({reg:'',recv:'',mfr:'',model:'',sn:'',memo:''});
const fresh=()=>({type:'temp',insp:'',date:today(),n:3,pre:'C-'+new Date().getFullYear()+'-',start:'',units:[U(),U(),U()],tb:{}});
let S;try{S=JSON.parse(localStorage.getItem(K))||fresh()}catch(e){S=fresh()}
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const TB=()=>S.tb[S.type]||(S.tb[S.type]=T[S.type].t.map((sp,i)=>mk(i,sp)));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inp=(p,v,x='')=>`<input data-p="${p}" value="${esc(v)}" enterkeyhint="next" autocomplete="off" ${x}>`;
function R(){
while(S.units.length<S.n)S.units.push(U());
const tb=TB(),n=S.n,ty=T[S.type],ths=rng(n).map(u=>`<th>${u+1}번</th>`).join('');
let h=`<h1>HCT Calibration</h1><div class="top"><button class="g" data-a="save">저장하기</button><button class="r" data-a="reset">초기화</button></div>`;
h+=`<div class="card"><div class="row"><label>교정자ID</label>${inp('insp',S.insp,'placeholder="T00000" style="width:100px"')}<label>교정일자</label>${inp('date',S.date,'inputmode="numeric" style="width:100px"')}</div>`;
h+=`<div class="row"><span class="grp"><label>교정대상</label><select id="type">${Object.keys(T).map(k=>`<option value="${k}"${k==S.type?' selected':''}>${T[k].name}</option>`).join('')}</select></span><span class="grp"><label>장비 수</label><button class="s" data-a="n-">−</button><b>${n}</b><button class="s" data-a="n+">＋</button></span></div>`;
h+=`<div class="row"><label>접수번호</label>${inp('pre',S.pre,'style="width:90px"')}${inp('start',S.start,'inputmode="numeric" placeholder="시작번호" style="width:90px"')}<button class="s" data-a="recv">자동입력</button></div>`;
h+=`<div class="sc"><table><tr><th class="st">장비</th>${ths}</tr>`;
[['reg','등록번호'],['recv','접수번호'],['mfr','제조사',1],['model','모델',1],['sn','기기번호']].forEach(([k,l,c])=>{
h+=`<tr><td class="st">${l}${c?` <button class="s" style="padding:2px 6px" data-a="cp:${k}" title="1번 값을 전체에 복사">⇉</button>`:''}</td>${rng(n).map(u=>`<td>${inp('units.'+u+'.'+k,S.units[u][k])}</td>`).join('')}</tr>`});
h+='</table></div>'+rng(n).map(u=>`<div class="row" style="margin:8px 0 0;align-items:flex-start"><label style="width:62px;padding-top:6px">${u+1}번 메모</label><textarea data-p="units.${u}.memo" rows="1" enterkeyhint="next" style="flex:1">${esc(S.units[u].memo)}</textarea></div>`).join('')+'</div>';
tb.forEach((t,ti)=>{
const sp=ty.t[t.si],P=`tb.${S.type}.${ti}`,fx=!!sp.fix,one=t.reps.length==1;
h+=`<div class="card"><div class="row"><b>${esc(t.m['측정항목']||sp.n)}</b>${sp.add&&tb.length>1?`<button class="r" style="margin-left:auto;padding:4px 8px" data-a="deltbl:${ti}">표 삭제</button>`:''}</div>`;
if(sp.m.length)h+=`<div class="row">${sp.m.map(k=>`<label>${k}</label>${inp(P+'.m.'+k,t.m[k],'style="width:90px"')}`).join('')}</div>`;
h+=`<div class="sc"><table><tr>${sp.ch?'<th>채널</th>':''}<th class="st">${fx?'구분':'명목값'}</th>${one?'':'<th>회차</th>'}${ths}</tr>`;
t.rows.forEach((r,ri)=>t.reps.forEach((rl,rp)=>{
h+='<tr>';
if(rp==0){const rs=`rowspan="${t.reps.length}"`;
if(sp.ch)h+=`<td ${rs}>${inp(`${P}.rows.${ri}.ch`,r.ch,'style="width:40px;min-width:40px"')}</td>`;
h+=`<td class="st" ${rs}>${fx?esc(r.nom):inp(`${P}.rows.${ri}.nom`,r.nom,'inputmode="decimal" style="width:56px;min-width:56px"')+`<br><button class="s" style="padding:0 6px" data-a="delrow:${ti}:${ri}">✕</button>`}</td>`}
if(!one)h+=`<th>${esc(rl)}</th>`;
h+=rng(n).map(u=>`<td>${inp(`${P}.rows.${ri}.v.${rp}_${u}`,r.v[rp+'_'+u],'inputmode="decimal"')}</td>`).join('')+'</tr>'}));
h+='</table></div>';
if(!fx)h+=`<div class="row" style="margin:6px 0 0"><button class="s" data-a="addrow:${ti}">＋ 명목값 행</button><button class="s" data-a="addrep:${ti}">＋ 회차</button><button class="s" data-a="delrep:${ti}">－ 회차</button></div>`;
h+='</div>'});
if(ty.t.some(s=>s.add))h+=`<button class="s" style="width:100%;padding:10px" data-a="addtbl">＋ 표 추가</button>`;
$('#app').innerHTML=h;document.querySelectorAll('textarea').forEach(gw)}
document.addEventListener('input',e=>{
const p=e.target.dataset.p;if(!p)return;let v=e.target.value;
if(p=='insp'){v=[...v].map(c=>J[c]||c).join('').toUpperCase();e.target.value=v}
if(p=='pre'){v=v.toUpperCase();e.target.value=v}
const a=p.split('.'),l=a.pop();let o=S;a.forEach(k=>o=o[k]);o[l]=v;sv();if(e.target.tagName=='TEXTAREA')gw(e.target)});
document.addEventListener('change',e=>{if(e.target.id=='type'){S.type=e.target.value;sv();R()}});
document.addEventListener('keydown',e=>{
if(e.key=='Enter'&&['INPUT','TEXTAREA'].includes(e.target.tagName)){e.preventDefault();const l=[...document.querySelectorAll('input,textarea')],i=l.indexOf(e.target);l[i+1]?l[i+1].focus():e.target.blur()}});
document.addEventListener('click',async e=>{
const b=e.target.closest('[data-a]');if(!b)return;
const[a,x,y]=b.dataset.a.split(':'),tb=TB(),t=tb[x];
if(a=='n+'){if(S.n<20)S.n++}
else if(a=='n-'){if(S.n>1)S.n--}
else if(a=='recv'){const s=S.start;S.units.slice(0,S.n).forEach((u,i)=>{u.recv=S.pre+(s===''?'':String(parseInt(s,10)+i).padStart(s.length,'0'))})}
else if(a=='cp')S.units.forEach(u=>u[x]=S.units[0][x]);
else if(a=='addrow')t.rows.push({nom:'',ch:'',v:{}});
else if(a=='delrow'){if(t.rows.length>1)t.rows.splice(y,1)}
else if(a=='addrep')t.reps.push(t.reps.length+1+'회');
else if(a=='delrep'){if(t.reps.length>1)t.reps.pop()}
else if(a=='addtbl')tb.push(mk(0,T[S.type].t[0]));
else if(a=='deltbl')tb.splice(x,1);
else if(a=='reset'){if(confirm('입력한 내용을 모두 지울까요?')){const k=S.insp,ty=S.type;S=fresh();S.insp=k;S.type=ty;sv();R()}return}
else if(a=='save'){await save();return}
sv();R()});
const cl=v=>String(v??'').replace(/[,\r\n]+/g,' ').trim();
async function save(){
const tb=TB(),n=S.n,ty=T[S.type];
let s=`저장일시,${new Date().toLocaleString()}\n교정대상,${ty.name}\n교정자ID,${cl(S.insp)}\n교정일자,${cl(S.date)}\n장비수,${n}\n\n`;
rng(n).forEach(u=>{const q=S.units[u];
s+=`[UNIT_START],${u+1}\n접수번호,${cl(q.recv)}\n등록번호,${cl(q.reg)}\n제조사,${cl(q.mfr)}\n모델,${cl(q.model)}\n기기번호,${cl(q.sn)}\n메모,${cl(q.memo)}\n\n`;
tb.forEach((t,ti)=>{const sp=ty.t[t.si];
s+=`[TABLE_START],Table_${ti+1},Rows,${t.rows.length},Cols,${t.reps.length+1+(sp.ch?1:0)}\n`;
s+=`표이름,${cl(t.m['측정항목']||sp.n)}`+sp.m.filter(k=>k!='측정항목').map(k=>`,${k},${cl(t.m[k])}`).join('')+'\n';
s+=(sp.ch?'채널,':'')+(sp.fix?'구분':'명목값')+t.reps.map(r=>','+cl(r)).join('')+'\n';
t.rows.forEach(r=>{s+=(sp.ch?cl(r.ch)+',':'')+cl(r.nom)+t.reps.map((_,rp)=>','+cl(r.v[rp+'_'+u])).join('')+'\n'});
s+='[TABLE_END]\n\n'});
s+='[UNIT_END]\n\n'});
let hs='N/A';
try{hs=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){}
const nm=((cl(S.units[0].recv)||'기록')+(n>1?'_외'+(n-1)+'대':'')+'_'+ty.name.replace(/[\/\s]/g,'')+'.csv').replace(/[\\/:*?"<>|]/g,'_');
const f=new File(['\uFEFF'+s+'검증코드(Hash),'+hs],nm,{type:'text/csv;charset=utf-8'});
try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name=='AbortError')return}
const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=nm;document.body.appendChild(a);a.click();a.remove()}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const gw=el=>{el.style.height='auto';el.style.height=el.scrollHeight+2+'px'};
addEventListener('resize',()=>{document.querySelectorAll('textarea').forEach(gw)});
const kb=$('#kb'),vv=window.visualViewport,dec=el=>el&&el.tagName=='INPUT'&&el.inputMode=='decimal';
const pos=()=>{if(vv)kb.style.bottom=Math.max(0,innerHeight-vv.height-vv.offsetTop)+'px'};
if(vv)['resize','scroll'].forEach(v=>vv.addEventListener(v,pos));
document.addEventListener('focusin',e=>{if(dec(e.target)){kb.style.display='flex';pos();const t=e.target;setTimeout(()=>t.scrollIntoView({block:'center',inline:'nearest'}),350)}});
document.addEventListener('focusout',()=>setTimeout(()=>{if(!dec(document.activeElement))kb.style.display='none'},120));
kb.addEventListener('pointerdown',e=>{
e.preventDefault();const k=e.target.closest('[data-k]'),el=document.activeElement;if(!k||!dec(el))return;
if(k.dataset.k=='sign'){const v=el.value;el.value=v[0]=='-'?v.slice(1):'-'+v;el.dispatchEvent(new Event('input',{bubbles:true}))}
else if(k.dataset.k=='next'){const l=[...document.querySelectorAll('input,textarea')],n=l[l.indexOf(el)+1];n?n.focus():el.blur()}
else el.blur()});
R();
</script>
</body>
</html>
